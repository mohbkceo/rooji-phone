services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      DATA_DIR: /data
    volumes:
      - roudji-data:/data
volumes:
  roudji-data:
